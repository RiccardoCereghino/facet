name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite makes real git commits (reap-blocker tests); a fresh runner has no
  # git identity, so supply one for all platforms.
  GIT_AUTHOR_NAME: facet CI
  GIT_AUTHOR_EMAIL: ci@facet.invalid
  GIT_COMMITTER_NAME: facet CI
  GIT_COMMITTER_EMAIL: ci@facet.invalid
  # The organisation-name guard (internal/privacy) must not carry an employer's
  # internal names in this public repo, so its word list is supplied
  # out-of-band as a secret rather than committed. With the secret set, the
  # guard runs; unset, the guard fails in CI (CI=true) rather than passing green
  # having checked nothing. Define it under repo Settings -> Secrets and
  # variables -> Actions as a comma-separated list.
  #
  # Workflow-level, not job-level: the guard runs wherever `go test` runs, so
  # every tier needs it. Scoping it to the Linux job made the other two fail
  # closed, which is the guard behaving correctly and the workflow being wrong.
  FACET_DENYLIST: ${{ secrets.FACET_DENYLIST }}

jobs:
  # Tier 1 -- Linux, the cheap gate. Runs every check, on every push and every
  # pull request including drafts. This leg should catch essentially all
  # breakage.
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The major.minor series, not go.mod's exact `go 1.25.0`, plus
          # check-latest: setup-go would otherwise install exactly 1.25.0, and
          # govulncheck rightly fails a toolchain with known stdlib
          # vulnerabilities. CI should build with the newest patch of the series
          # the module targets.
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # staticcheck, errcheck and unused, configured in .golangci.yml. Run via
      # the action rather than a go.mod tool directive: the directive would drag
      # golangci-lint's whole dependency tree into this module's go.sum, which
      # for a module with two direct dependencies is a poor trade.
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - run: go test -race ./...

  # Tier 2 -- the other platforms, deliberately gated behind Linux and
  # deliberately narrower.
  #
  #   * `needs: linux` -- there is no point paying a second and third runner to
  #     learn what the first one already knows. A gofmt slip or a lint finding
  #     now fails in well under a minute instead of after three platform runs
  #     finish in parallel. Note this is NOT a billing argument: facet is a
  #     public repository, so GitHub-hosted runners are free on every OS. It is
  #     about how fast a red tells you something, and about not queueing three
  #     runners for one answer.
  #
  #   * skipped on draft pull requests, and on pull requests not targeting
  #     `main` -- work in progress still gets the full Linux leg, and marking a
  #     PR ready for review triggers these.
  #
  #   * build and test only -- gofmt, lint and govulncheck are
  #     platform-independent by construction, so running them three times buys
  #     nothing. What these legs uniquely prove is that the code compiles and
  #     its tests pass where the filesystem semantics differ: this project
  #     manipulates real files, and Windows locks a file while any process holds
  #     it open where Unix does not.
  #
  # The cost is serialized feedback -- a Windows-only failure surfaces one job
  # later than it used to. That is the right trade while such failures are rare.
  #
  # `windows` is named as its own job so a secondary platform's red is still
  # reported as a distinct result. What that red means for what may be merged is
  # the platform policy in CONTRIBUTING.md.
  #
  # Never add a tolerance construct (continue-on-error, if: always(), || true)
  # to any job here. The tiering is about when a check runs, never about whether
  # its result is believed.
  macos:
    name: macos
    needs: linux
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25' # newest patch of the series; see the linux job
          check-latest: true
      - run: go build ./...
      - run: go test -race ./...

  windows:
    name: windows
    needs: linux
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25' # newest patch of the series; see the linux job
          check-latest: true
      - run: go build ./...
      - run: go test -race ./...
